<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <title>{{TITLE}} — Blog de Asgard Nutrición Deportiva</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="canonical" href="{{CANONICAL_URL}}">

  <!-- Open Graph / vistas previas en WhatsApp, Facebook, etc. -->
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <meta property="og:site_name" content="Asgard Nutrición Deportiva">
  <meta property="og:locale" content="es_ES">
  {{OG_IMAGE}}
  <meta property="article:published_time" content="{{DATE_ISO}}">
  <meta property="article:author" content="{{AUTHOR}}">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="{{TWITTER_CARD_TYPE}}">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  {{TWITTER_IMAGE}}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caudex:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">

  <!-- Datos estructurados para Google (rich results) -->
  <script type="application/ld+json">
  {{JSON_LD}}
  </script>
</head>
<body>

  <!--HEADER-->

  <main id="main">
    <article>
      <div class="container container--narrow">

        <nav class="breadcrumbs" aria-label="Migas de pan" style="margin-top: var(--space-lg);">
          <a href="/index.html">Inicio</a>
          <span class="breadcrumbs__sep">/</span>
          <a href="/blog.html">Blog</a>
          <span class="breadcrumbs__sep">/</span>
          <span>{{TITLE}}</span>
        </nav>

        <header class="article-header">
          <h1 class="article-header__title">{{TITLE}}</h1>
          <p class="article-header__meta">Por {{AUTHOR}} — {{DATE_LABEL}}</p>
        </header>

{{COVER_HTML}}
        <div class="article-body">
{{BODY_HTML}}
        </div>

        <footer class="article-footer">
          <div class="article-footer__author">
            <strong>{{AUTHOR}}</strong>
            Fundador de Asgard Nutrición Deportiva
          </div>
          <a class="btn btn--ghost" href="/blog.html">← Volver al blog</a>
        </footer>

      </div>
    </article>
  </main>

  <!--FOOTER-->

  <script src="/js/main.js"></script>
</body>
</html>
