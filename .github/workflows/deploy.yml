name: Construir y publicar el sitio

# Se ejecuta automáticamente cada vez que se sube (push) algo a la
# rama "main" — incluida una nueva entrada del blog. No hace falta
# lanzarlo a mano.
on:
  push:
    branches: [master]
  workflow_dispatch:  # también se puede lanzar a mano desde la pestaña "Actions"

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Construir el sitio (blog/*.md -> dist/)
        run: python build_site.py

      - name: Publicar dist/ en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
